name: Go

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
      - run: go build ./...
        working-directory: app

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
      - run: go vet ./...
        working-directory: app

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: test -z "$(gofmt -l app)"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
      # No network in tests: parser fixtures are saved HTML, database
      # tests open a file in a temporary directory.
      - run: go test ./...
        working-directory: app
