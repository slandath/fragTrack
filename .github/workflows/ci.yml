name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fragtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Disposable service container only — never a development or production database.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fragtest?sslmode=disable

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # pnpm check runs formatting, root/client lint, server/client type
      # checks, and unit tests — the same gates documented for local use.
      - run: pnpm check
      - run: pnpm build

      # Migration smoke test plus the real router integration suite. The
      # integration setup also applies every committed migration, so a broken
      # migration fails CI before the tests themselves run.
      - name: Apply migrations to disposable database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: pnpm test:integration
